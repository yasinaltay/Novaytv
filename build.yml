name: Build Novay_Tv Android TV APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js & Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Android TV WebView APK Project
        run: |
          mkdir -p www
          cp index.html www/index.html
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Novay_Tv" "com.novay.tv" --web-dir www
          npx cap add android
          cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload Ready Novay_Tv APK
        uses: actions/upload-artifact@v4
        with:
          name: Novay_Tv-v4.6-FireStick-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
